<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration - Attendance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="login-page">
    <div class="container-fluid">
        <div class="row min-vh-100 align-items-center justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-lg border-0 login-card">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <div class="login-icon mb-3">
                                <i class="fas fa-user-shield"></i>
                            </div>
                            <h2 class="fw-bold text-success">Admin Registration</h2>
                            <p class="text-muted">Attendance Tracker System</p>
                        </div>

                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="regEmail" class="form-label fw-500">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-envelope"></i></span>
                                    <input type="email" class="form-control form-control-lg border-start-0" id="regEmail" 
                                           placeholder="Enter your email" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="regPassword" class="form-label fw-500">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control form-control-lg border-start-0" id="regPassword" 
                                           placeholder="Create a password (min 6 characters)" required>
                                </div>
                                <small class="form-text text-muted">At least 6 characters</small>
                            </div>

                            <div class="mb-4">
                                <label for="regConfirmPassword" class="form-label fw-500">Confirm Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control form-control-lg border-start-0" id="regConfirmPassword" 
                                           placeholder="Confirm your password" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-success btn-lg w-100 mb-3 fw-600">
                                <i class="fas fa-user-plus"></i> Create Admin Account
                            </button>
                        </form>

                        <div id="registerMessage" class="alert d-none" role="alert"></div>

                        <hr>
                        <p class="text-center text-muted small">
                            Already have an account? 
                            <a href="index.html" class="text-primary fw-bold">Login Here</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
