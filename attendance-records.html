<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Records - Attendance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary sticky-top">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">📋 Attendance Tracker</span>
            <div class="text-white">
                <span id="userEmail" class="me-3"></span>
                <a href="dashboard.html" class="btn btn-outline-light btn-sm me-2">Back to Dashboard</a>
                <button class="btn btn-outline-light btn-sm" id="logoutBtn">Mag-Logout</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <h2 class="fw-bold mb-4">📋 Attendance Records</h2>

                <!-- Filters -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label for="filterDate" class="form-label">Petsa</label>
                                <input type="date" class="form-control" id="filterDate">
                            </div>
                            <div class="col-md-3">
                                <label for="filterEmployee" class="form-label">Employee ID / Pangalan</label>
                                <input type="text" class="form-control" id="filterEmployee" 
                                       placeholder="Filter by ID or name">
                            </div>
                            <div class="col-md-3">
                                <label for="filterStatus" class="form-label">Status</label>
                                <select class="form-control" id="filterStatus">
                                    <option value="">Lahat ng Status</option>
                                    <option value="Present">Present</option>
                                    <option value="Late">Late</option>
                                    <option value="Absent">Absent</option>
                                    <option value="On Leave">On Leave</option>
                                    <option value="Work From Home">Work From Home</option>
                                    <option value="Incomplete">Incomplete</option>
                                    <option value="Error">Error</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="filterDepartment" class="form-label">Departamento</label>
                                <select class="form-control" id="filterDepartment">
                                    <option value="">Lahat ng Departamento</option>
                                    <option value="IT">IT/Teknolohiya</option>
                                    <option value="HR">HR/Tao Resources</option>
                                    <option value="Sales">Sales/Marketing</option>
                                    <option value="Operations">Operations</option>
                                    <option value="Finance">Finance/Accounting</option>
                                    <option value="Admin">Administration</option>
                                    <option value="Support">Customer Support</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-12">
                                <button class="btn btn-primary" id="filterBtn">🔍 Filter</button>
                                <button class="btn btn-secondary" id="resetFilterBtn">🔄 Reset</button>
                                <button class="btn btn-info" id="exportBtn">📥 Export to CSV</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Records Table -->
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover table-striped" id="attendanceTable">
                                <thead class="table-primary">
                                    <tr>
                                        <th>Employee ID</th>
                                        <th>Pangalan</th>
                                        <th>Departamento</th>
                                        <th>Posisyon</th>
                                        <th>Petsa</th>
                                        <th>Time In</th>
                                        <th>Time Out</th>
                                        <th>Oras ng Trabaho</th>
                                        <th>Status</th>
                                        <th>Late (min)</th>
                                        <th>Undertime (min)</th>
                                        <th>Overtime (min)</th>
                                        <th>Remarks</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="attendanceTableBody">
                                    <tr id="noRecords" class="text-muted text-center">
                                        <td colspan="14">Walang attendance records</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <nav aria-label="Page navigation" class="mt-4">
                    <ul class="pagination justify-content-center" id="pagination">
                        <li class="page-item disabled" id="prevPage">
                            <a class="page-link" href="#">Previous</a>
                        </li>
                        <li class="page-item active" id="pageNumber">
                            <span class="page-link">1</span>
                        </li>
                        <li class="page-item" id="nextPage">
                            <a class="page-link" href="#">Next</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Attendance Record</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="editRecordId">
                        
                        <div class="mb-3">
                            <label for="editTimeIn" class="form-label">Time In</label>
                            <input type="time" class="form-control" id="editTimeIn">
                        </div>

                        <div class="mb-3">
                            <label for="editTimeOut" class="form-label">Time Out</label>
                            <input type="time" class="form-control" id="editTimeOut">
                        </div>

                        <div class="mb-3">
                            <label for="editStatus" class="form-label">Status</label>
                            <select class="form-control" id="editStatus">
                                <option value="Present">Present</option>
                                <option value="Late">Late</option>
                                <option value="Absent">Absent</option>
                                <option value="On Leave">On Leave</option>
                                <option value="Work From Home">Work From Home</option>
                                <option value="Incomplete">Incomplete</option>
                                <option value="Error">Error</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="editRemarks" class="form-label">Remarks</label>
                            <textarea class="form-control" id="editRemarks" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveEditBtn">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/attendance.js"></script>
</body>
</html>
